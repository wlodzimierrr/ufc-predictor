name: Validate Published Image

on:
  workflow_dispatch:
    inputs:
      digest:
        description: "Full sha256: image digest from the GHCR publication"
        required: true
        type: string
      expected_revision:
        description: "Full 40-character source Git SHA recorded by that image"
        required: true
        type: string

permissions:
  contents: read
  packages: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout validation harness
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Log in to GHCR for read-only image access
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull exact image and run isolated synthetic smoke
        env:
          IMAGE_DIGEST: ${{ inputs.digest }}
          EXPECTED_REVISION: ${{ inputs.expected_revision }}
        run: |
          python3 scripts/automation/smoke_image.py \
            --digest "$IMAGE_DIGEST" \
            --expected-revision "$EXPECTED_REVISION" \
            --evidence artifacts/image-smoke.json

      - name: Retain sanitized evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/image-smoke.json
          if-no-files-found: error
          retention-days: 30
